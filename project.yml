name: TigerLillies
options:
  bundleIdPrefix: com.buildertest
  deploymentTarget:
    iOS: "17.2"
targets:
  TigerLillies:
    type: application
    platform: iOS
    sources:
      - TigerLillies
    info:
      path: TigerLillies/Info.plist
      properties:
        CFBundleDisplayName: Tiger Lillies
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buildertest.tigerlilliesdemo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
    schemes:
      TigerLillies:
        build:
          targets:
            TigerLillies: all
