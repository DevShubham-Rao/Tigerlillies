const STORAGE='tl-prototype-v1';
const seed=()=>({products:structuredClone(INITIAL_PRODUCTS),cart:[],orders:[],favorites:[],notices:[{id:uid(),title:'Welcome to Tiger Lillies',body:'This is a local test. Real orders are not being placed.',at:Date.now(),read:false}],messages:[{id:uid(),by:'shop',text:'Welcome! This message conversation is local to the prototype.',at:Date.now()}],website:[],reviews:[],customer:'',lastVisit:Date.now()});
const persisted=()=>{try{const obj=JSON.parse(localStorage.getItem(STORAGE));return obj&&Array.isArray(obj.products)?obj:null}catch{return null}};
let db=persisted()||seed(), view='home', owner=false, ownerTab='overview', category='All', term='', editing=null, modal='', itemID='', customNote='', qty=1, rating=5, toastTimer;
if(db.lastVisit && Date.now()-db.lastVisit>=14*24*60*60*1000){const points=db.orders.reduce((n,o)=>n+(o.stars||0),0);db.notices.unshift({id:uid(),title:"It's been a while!",body:`Welcome back! You have ${points} Tiger Stars in this demo.`,at:Date.now(),read:false})}db.lastVisit=Date.now();
function uid(){return (globalThis.crypto?.randomUUID?.()||Math.random().toString(36).slice(2))}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(db))}catch{}};
const esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
const money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'});
const day=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const stamp=d=>new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const p=id=>db.products.find(a=>a.id===id);
const sum=ls=>ls.reduce((s,l)=>s+l.price*l.qty,0);
const stars=()=>db.orders.reduce((a,o)=>a+(o.stars||0),0);
const appSales=()=>db.orders.filter(o=>o.status==='Completed').reduce((a,o)=>a+sum(o.lines),0);
const webSales=()=>db.website.reduce((a,o)=>a+o.amount,0);
const streak=()=>{const dates=new Set(db.orders.filter(o=>o.status==='Completed').map(o=>new Date(o.at).toDateString()));let d=new Date();if(!dates.has(d.toDateString()))d.setDate(d.getDate()-1);let count=0;while(dates.has(d.toDateString())){count++;d.setDate(d.getDate()-1)}return count};
const btn=(text,fn,cls='button')=>`<button class="${cls}" onclick="${fn}">${text}</button>`;
const section=(title,sub='')=>`<div class="section-head"><div><h2>${title}</h2>${sub?`<div class="small" style="margin-top:5px">${sub}</div>`:''}</div></div>`;
const notice=(title,body)=>{db.notices.unshift({id:uid(),title,body,at:Date.now(),read:false});persist()};
const demoLabel='<div class="footnote">LOCAL PROTOTYPE · NO REAL ORDERS, PAYMENTS, OR WEBSITE SYNC</div>';
function flash(msg){const node=document.getElementById('toast');node.textContent=msg;node.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.add('hidden'),2600)}
function navigate(to){view=to;term='';category='All';modal='';document.getElementById('modal').innerHTML='';render();window.scrollTo(0,0)}
function ownerMode(toggle){owner=toggle;ownerTab='overview';navigate('home')}
function render(){document.getElementById('side').innerHTML=sidebar();document.getElementById('mobile').innerHTML=mobileNav();document.getElementById('content').innerHTML=owner?renderOwner():renderCustomer()}
function sidebar(){return `<div class="brand"><img alt="Tiger Lillies logo" src="${LOGO}"><div><strong>TIGER LILLIES</strong><em>Floral & Coffee</em></div></div><div class="sep"></div>${owner?`<div class="eyebrow small">Owner prototype</div>${['overview','orders','products','insights','messages'].map(v=>`<button class="navbtn ${ownerTab===v?'active':''}" onclick="ownerNav('${v}')">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}<div class="sep"></div><button class="owner-entry" onclick="ownerMode(false)">← Customer view</button>`:`${[['home','⌂','Home'],['shop','◈','Shop'],['cart','▢','Your bag'],['orders','▤','Orders'],['stars','☆','Tiger Stars'],['inbox','♧','Inbox'],['account','☷','More']].map(([key,ico,name])=>`<button class="navbtn ${view===key?'active':''}" onclick="navigate('${key}')">${ico} &nbsp; ${name}${key==='cart'&&db.cart.length?`<span class="n">${db.cart.reduce((a,b)=>a+b.qty,0)}</span>`:''}</button>`).join('')}<div class="sep"></div><button class="owner-entry" onclick="ownerMode(true)">✧ Open owner demo</button>`}<p class="aside-note">Prototype for <b>Tiger Lillies Floral & Coffee</b><br>205 Club Ln, Hamilton, GA<br>Data stays in this browser.</p>`}
function mobileNav(){const nodes=owner?[['overview','⌂','Home'],['orders','▤','Orders'],['products','✿','Items'],['insights','▥','Sales'],['messages','♧','Chat']]:[['home','⌂','Home'],['shop','◈','Shop'],['orders','▤','Orders'],['stars','☆','Stars'],['account','☷','More']];return nodes.map(([id,ico,label])=>`<button class="${(owner?ownerTab:view)===id?'active':''}" onclick="${owner?`ownerNav('${id}')`:`navigate('${id}')`}"><span>${ico}</span>${label}</button>`).join('')}
function header(){return `<div class="topbar"><div class="brand"><img alt="" src="${LOGO}"><div><strong>TIGER LILLIES</strong><em>Floral & Coffee</em></div></div><div class="row"><button class="button secondary compact" aria-label="notifications" onclick="navigate('inbox')">♧ ${db.notices.filter(n=>!n.read).length||''}</button><button class="button secondary compact" aria-label="bag" onclick="navigate('cart')">▢ ${db.cart.reduce((a,b)=>a+b.qty,0)||''}</button></div></div>`}
function productCard(item){return `<button class="product" onclick="showItem('${esc(item.id)}')"><div class="product-visual"><span class="flower" aria-hidden="true">${item.symbol}</span></div><div style="padding:0 5px 6px"><span class="pilltag">${esc(item.cat)}</span><h4>${esc(item.title)}</h4><p>From ${money(item.price)}</p><span class="small">${item.available?'Customize ↗':'Unavailable'}</span></div></button>`}
function renderCustomer(){const content={home:home,shop:shop,cart:cart,orders:orders,stars:rewards,inbox:inbox,account:account};return header()+(content[view]||home)()+demoLabel}
function home(){let active=db.orders.filter(o=>!['Completed','Cancelled'].includes(o.status)).length;return `<div style="margin-top:12px"><h1>A little joy,<br>ready when you are.</h1><p class="lead">Coffee to go. Flowers to make their day.</p></div><div class="panel hero section"><div><div class="eyebrow">TIGER LILLIES · HAMILTON</div><h2 style="font-size:34px;margin-top:15px">Thoughtful blooms.<br>Delicious moments.</h2><p>Personalized pickup orders, kept simple.</p>${btn('Explore the shop ↗',"navigate('shop')")}</div><div class="hero-art">✿</div></div><div class="stats section"><div class="card stat" onclick="navigate('stars')" role="button" tabindex="0"><div class="small">☆ TIGER STARS</div><b>${stars()}</b><div class="subtitle">Earn with completed orders</div></div><div class="card stat" onclick="navigate('orders')" role="button" tabindex="0"><div class="small">◷ ACTIVE ORDERS</div><b>${active}</b><div class="subtitle">Know when it's ready</div></div></div><div class="section">${section('Made for your day','A few favorites from the shop')}<div class="grid">${db.products.filter(a=>a.featured&&a.available).slice(0,3).map(productCard).join('')}</div></div>${db.favorites.length?`<div class="section">${section('Saved just for you')}<div class="items">${db.favorites.slice(0,2).map(f=>`<div class="card row between"><div><b>${esc(f.name)}</b><div class="small">${esc(p(f.product)?.title||'')} · ${esc(f.note)}</div></div>${btn('Add ↗',`addFavorite('${f.id}')`,'button secondary compact')}</div>`).join('')}</div></div>`:''}<div class="section card"><h3>Pickup in Hamilton</h3><p class="lead">205 Club Ln, Hamilton, GA 31811. Select a requested pickup time at checkout. The shop must confirm requests in a real version of this app.</p></div>`}
function shop(){const filtered=db.products.filter(a=>(category==='All'||a.cat===category)&&(!term||a.title.toLowerCase().includes(term.toLowerCase())||a.detail.toLowerCase().includes(term.toLowerCase())));return `${section('The shop','Coffee, flowers, and everything in between')}<input class="field" placeholder="Search the menu" aria-label="Search products" value="${esc(term)}" oninput="term=this.value;refreshProducts()"><div class="filters" style="margin-top:15px">${['All','Flowers','Coffee','Plants & Gifts'].map(c=>`<button class="chip ${category===c?'on':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div><div id="product-list" class="grid section" style="margin-top:15px">${filtered.length?filtered.map(productCard).join(''):'<div class="note-empty">No matching products.</div>'}</div><p class="small">Illustrative starting prices; availability and final customization pricing must be confirmed before launch.</p>`}
function refreshProducts(){const filtered=db.products.filter(a=>(category==='All'||a.cat===category)&&(!term||a.title.toLowerCase().includes(term.toLowerCase())||a.detail.toLowerCase().includes(term.toLowerCase())));document.getElementById('product-list').innerHTML=filtered.length?filtered.map(productCard).join(''):'<div class="note-empty">No matching products.</div>'}
function popup(content){document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){document.getElementById('modal').innerHTML='';modal=''}
function showItem(id){const item=p(id);if(!item)return;itemID=id;qty=1;customNote='';modal='item';popup(`<div class="modal-head"><div><span class="pilltag">${esc(item.cat)}</span><h2 style="margin-top:8px">${esc(item.title)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="product-visual" style="height:175px"><span class="flower">${item.symbol}</span></div><p>${esc(item.detail)}</p><p class="price">From ${money(item.price)}</p><div class="line"></div><label>Make it yours <span class="small">(colors, drink temperature, milk, flowers to avoid, card note)</span><textarea id="custom-note" class="field" rows="3" placeholder="Tell us what you have in mind…"></textarea></label><div class="row between" style="margin:16px 0"><b>Quantity</b><div class="stepper"><button onclick="changeDetailQty(-1)">−</button><b id="detail-qty">1</b><button onclick="changeDetailQty(1)">+</button></div></div><button class="button full" ${!item.available?'disabled':''} onclick="addDetail()">Add to bag · <span id="detail-price">${money(item.price)}</span></button><button class="button secondary full" style="margin-top:10px" ${!item.available?'disabled':''} onclick="saveFavorite()">☆ Save custom order</button><p class="small">This is a test. Actual shop ordering, pricing adjustments, and availability are not connected.</p>`)}
function changeDetailQty(delta){qty=Math.min(25,Math.max(1,qty+delta));document.getElementById('detail-qty').textContent=qty;document.getElementById('detail-price').textContent=money(p(itemID).price*qty)}
function addDetail(){const i=p(itemID);if(!i?.available)return;db.cart.push({id:uid(),productID:i.id,title:i.title,price:i.price,qty,note:document.getElementById('custom-note').value.trim()});persist();closeModal();render();flash('Added to your bag')}
function saveFavorite(){const title=prompt('Name this saved custom order (for example, My Friday Latte):');if(!title?.trim())return;db.favorites.push({id:uid(),product:itemID,name:title.trim(),note:document.getElementById('custom-note').value.trim()});persist();closeModal();render();flash('Custom order saved')}
function addFavorite(id){let favorite=db.favorites.find(f=>f.id===id),i=p(favorite?.product);if(!i?.available)return flash('That item is unavailable');db.cart.push({id:uid(),productID:i.id,title:i.title,price:i.price,qty:1,note:favorite.note});persist();render();flash('Added saved order')}
function cart(){return `${section(editing?'Edit your pending order':'Your bag','Multiple items, detailed notes, and a requested pickup time')}${!db.cart.length?'<div class="card note-empty">Your bag is empty.<p>Pick something from the shop to get started.</p>'+btn('Browse the shop',"navigate('shop')")+'</div>':`<div class="items">${db.cart.map(l=>`<div class="card"><div class="orderitem"><div class="iconbox">${p(l.productID)?.symbol||'✿'}</div><div class="grow"><div class="row between"><b>${esc(l.title)}</b><b>${money(l.price*l.qty)}</b></div><div class="small">${money(l.price)} each</div><div class="row between" style="margin-top:13px"><div class="stepper"><button onclick="cartQty('${l.id}',-1)">−</button><b>${l.qty}</b><button onclick="cartQty('${l.id}',1)">+</button></div><button class="link small" onclick="removeLine('${l.id}')">Remove</button></div></div></div><label class="small" style="margin-top:12px">Item changes<input class="field" value="${esc(l.note)}" placeholder="Make a modification…" onchange="cartNote('${l.id}',this.value)"></label></div>`).join('')}</div><div class="card section"><h3>Pickup details</h3><div class="form-grid" style="margin-top:14px"><label>Name for pickup<input id="customer" class="field" value="${esc(editing?db.orders.find(o=>o.id===editing)?.name:db.customer||'')}" placeholder="Your name"></label><label>Requested date and time<input id="pickup" class="field" type="datetime-local" value="${editing?esc(db.orders.find(o=>o.id===editing)?.pickup||''):futureLocal()}"></label></div><label style="margin-top:13px">Order notes<textarea class="field" id="order-note" rows="3" placeholder="Complex order instructions, pickup details…">${esc(editing?db.orders.find(o=>o.id===editing)?.note||'':'')}</textarea></label><p class="small">No money is charged and no request is sent to the real store.</p></div><div class="card section"><div class="row between"><b>Estimated total</b><h3>${money(sum(db.cart))}</h3></div><p class="small">Excludes tax, add-ons and size adjustments. No actual pickup time is guaranteed.</p><button class="button full" onclick="checkout()">${editing?'Save changes':'Place test order'} ↗</button>${editing?'<button class="button secondary full" style="margin-top:9px" onclick="cancelEdit()">Cancel editing</button>':''}</div>`}`}
function futureLocal(){const d=new Date(Date.now()+60*60*1000);d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function cartQty(id,n){const l=db.cart.find(a=>a.id===id);if(!l)return;l.qty+=n;if(l.qty<=0)db.cart=db.cart.filter(a=>a.id!==id);persist();render()}
function removeLine(id){db.cart=db.cart.filter(a=>a.id!==id);persist();render()}
function cartNote(id,text){const l=db.cart.find(a=>a.id===id);if(l){l.note=text;persist()}}
function checkout(){const name=document.getElementById('customer')?.value.trim(),pickup=document.getElementById('pickup')?.value,note=document.getElementById('order-note')?.value||'';if(!name||db.cart.length===0)return flash('Add items and enter your name');if(!pickup||Date.parse(pickup)<=Date.now())return flash('Choose a future pickup time');if(db.cart.some(l=>!p(l.productID)?.available))return flash('Some items are unavailable');if(editing){let old=db.orders.find(o=>o.id===editing);if(!old||old.status!=='Placed')return flash('This order can no longer be edited');Object.assign(old,{name,pickup,note,lines:structuredClone(db.cart)});notice('Order updated','Your local test order was modified.')}else{let id=uid();db.orders.unshift({id,at:Date.now(),name,pickup,note,lines:structuredClone(db.cart),status:'Placed',stars:0});notice('Test order placed','The order was saved only in this browser.')}db.customer=name;db.cart=[];editing=null;persist();navigate('orders');flash('Test order saved · not sent to shop')}
function orders(){return `${section('Order history','From the first request to ready for pickup')}${!db.orders.length?'<div class="card note-empty">No orders yet.<p>Test orders will appear here.</p></div>':`<div class="items">${db.orders.map(o=>`<div class="card"><div class="row between" style="align-items:start"><div><h3>#${esc(o.id.slice(0,6)).toUpperCase()}</h3><div class="small">${stamp(o.at)}</div></div><span class="badge">${o.status}</span></div><p class="small" style="margin:10px 0">Pickup requested: <b>${esc(new Date(o.pickup).toLocaleString())}</b></p>${o.lines.map(l=>`<div class="row between mini" style="margin-top:8px"><div><b>${l.qty}× ${esc(l.title)}</b>${l.note?`<div class="small">${esc(l.note)}</div>`:''}</div>${money(l.qty*l.price)}</div>`).join('')}<div class="line"></div><div class="row between"><b>Total ${money(sum(o.lines))}</b>${o.status==='Placed'?btn('Edit order',`editOrder('${o.id}')`,'button secondary compact'):o.status==='Completed'&&!db.reviews.some(r=>r.order===o.id)?btn('Rate order',`reviewOrder('${o.id}')`,'button secondary compact'):o.status==='Completed'?'<span class="small">☆ Reviewed or completed</span>':''}</div></div>`).join('')}</div>`}`}
function editOrder(id){const o=db.orders.find(o=>o.id===id);if(!o||o.status!=='Placed')return flash('Already being prepared — cannot edit');db.cart=structuredClone(o.lines);editing=id;persist();navigate('cart')}
function cancelEdit(){editing=null;db.cart=[];persist();render()}
function reviewOrder(id){modal='review';rating=5;popup(`<div class="modal-head"><h2>How was your experience?</h2><button class="close" onclick="closeModal()">×</button></div><div class="star-row" id="star-buttons"></div><label style="margin:14px 0">Optional feedback<textarea id="review-text" rows="4" class="field"></textarea></label><button class="button full" onclick="submitReview('${id}')">Save feedback</button><p class="small">This review remains private in the local demo; it does not post on Google.</p>`);paintStars()}
function paintStars(){const node=document.getElementById('star-buttons');if(node)node.innerHTML=Array.from({length:5},(_,i)=>`<button title="${i+1} stars" onclick="rating=${i+1};paintStars()">${i<rating?'★':'☆'}</button>`).join('')}
function submitReview(id){if(db.reviews.some(x=>x.order===id))return;db.reviews.push({id:uid(),order:id,rating,text:document.getElementById('review-text').value.trim()});persist();closeModal();render();flash('Feedback saved')}
function rewards(){let pts=stars();return `${section('Tiger Stars','Clear, consistent points and a little extra motivation')}<div class="panel section"><div class="row between" style="align-items:start"><div><div class="eyebrow">YOUR BALANCE</div><div style="font:500 85px Georgia,serif;line-height:1.3">${pts}</div><div class="eyebrow">STARS</div></div><div style="font-size:75px">☆</div></div><div class="progress" style="margin-top:18px"><b style="width:${pts%100}%"></b></div><p class="mini">${pts>=100?'A 100-star milestone reached':'Just '+(100-pts%100)+' stars to your first 100-star milestone'} · Perks not yet redeemable</p></div><div class="stats section"><div class="card stat"><div class="small">♨ PURCHASE STREAK</div><b>${streak()} days</b><div class="subtitle">Consecutive purchase days</div></div><div class="card stat"><div class="small">▤ COMPLETED</div><b>${db.orders.filter(o=>o.status==='Completed').length}</b><div class="subtitle">Orders in this test</div></div></div><div class="section">${section('How it works')}<div class="card stack"><b>☆ 1 star for every $1 spent</b><p class="small">Stars are rounded down and awarded only when an order is marked Completed. Cancelled orders receive no points.</p><div class="line"></div><b>♢ 100-star milestone</b><p class="small">Suggested possible perk: $5 off. Actual redemption is disabled pending store policy and checkout integration.</p><div class="line"></div><b>♨ Purchase streaks</b><p class="small">One or more completed orders per consecutive day count as one streak day.</p></div></div><div class="section">${section('Saved custom orders','One-tap reordering with the same notes')}${db.favorites.length?`<div class="items">${db.favorites.map(f=>`<div class="card row between"><div><b>${esc(f.name)}</b><p class="small" style="margin:5px 0">${esc(p(f.product)?.title||'')} · ${esc(f.note)}</p></div><div class="row">${btn('Add',`addFavorite('${f.id}')`,'button secondary compact')}${btn('×',`deleteFavorite('${f.id}')`,'button secondary compact')}</div></div>`).join('')}</div>`:'<div class="card note-empty">Save a custom drink or bouquet from its product page.</div>'}</div>`}
function deleteFavorite(id){db.favorites=db.favorites.filter(x=>x.id!==id);persist();render()}
function inbox(){db.notices.forEach(n=>n.read=true);persist();return `${section('Your inbox','Item announcements, order progress and local messages')}<div class="row between section"><h3>Notifications</h3><span class="badge">${db.notices.length}</span></div><div class="items">${db.notices.map(n=>`<div class="card notice"><b>${esc(n.title)}</b><p class="small" style="margin:8px 0">${esc(n.body)}</p><div class="small">${stamp(n.at)}</div></div>`).join('')}</div><div class="section">${section('Messages','Test-only conversation on this device')}<div class="card"><div style="max-height:300px;overflow:auto">${db.messages.map(m=>`<div class="message ${m.by==='shop'?'shop':''}"><b class="eyebrow">${m.by==='shop'?'Tiger Lillies':'You'}</b><p style="margin:6px 0">${esc(m.text)}</p><small>${stamp(m.at)}</small></div>`).join('')}</div><div class="row"><input class="field grow" id="msg" placeholder="Ask about your order…" onkeydown="if(event.key==='Enter')sendMessage('customer')"><button class="button" onclick="sendMessage('customer')">Send ↗</button></div></div></div>`}
function sendMessage(by){const node=document.getElementById('msg'),text=node?.value?.trim();if(!text)return;db.messages.push({id:uid(),by,text,at:Date.now()});if(by==='shop')notice('New message from Tiger Lillies',text);persist();render();flash('Saved on this device')}
function account(){return `${section('Your Tiger Lillies','Made to be simple, accessible, and personal')}<div class="items"><div class="card"><div class="row between"><h3>Easy access</h3><span>↗</span></div><p class="lead">Check your orders, stars, and messages from anywhere in this demo.</p><div class="row" style="margin-top:15px">${btn('Notifications',"navigate('inbox')",'button secondary compact')}${btn('My stars',"navigate('stars')",'button secondary compact')}</div></div><div class="card"><h3>Offline-first test</h3><p class="lead">This browser prototype saves data on your browser when available. It does not synchronize with shop devices or the actual ordering website.</p></div><div class="card"><h3>Owner tools</h3><p class="lead">Manage items, update order readiness, and review example sales numbers.</p>${btn('Open owner studio ↗','ownerMode(true)')}</div><div class="card"><h3>Store information</h3><p class="lead">Tiger Lillies Floral & Coffee<br>205 Club Ln, Hamilton, GA 31811<br>(706) 801-0021</p></div><button class="button secondary" onclick="resetDemo()">Reset local test data</button></div>`}
function resetDemo(){if(!confirm('Clear all local demo orders, messages and rewards?'))return;db=seed();editing=null;persist();owner=false;navigate('home');flash('Demo data reset')}
function ownerNav(to){ownerTab=to;render();window.scrollTo(0,0)}
function renderOwner(){return `<div class="topbar"><div class="brand"><img alt="Tiger Lillies logo" src="${LOGO}"><div><strong>TIGER LILLIES</strong><em>Owner studio</em></div></div>${btn('← Customer view','ownerMode(false)','button secondary compact')}</div><span class="pilltag">OWNER MODE · LOCAL TEST ONLY</span><div class="owner-head"><div><h1 style="font-size:37px">Good morning, Tiger Lillies.</h1><p class="lead">A clearer view of what needs your attention.</p></div></div><div class="filters owner-tabs">${['overview','orders','products','insights','messages'].map(t=>`<button class="chip ${ownerTab===t?'on':''}" onclick="ownerNav('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${({overview:ownerOverview,orders:ownerOrders,products:ownerProducts,insights:ownerInsights,messages:ownerMessages}[ownerTab]||ownerOverview)()+demoLabel}`}
function ownerOverview(){const active=db.orders.filter(x=>!['Cancelled','Completed'].includes(x.status)).sort((a,b)=>new Date(a.pickup)-new Date(b.pickup));return `<div class="stats"><div class="card stat"><div class="small">PICKUP QUEUE</div><b>${active.length}</b><div class="subtitle">Active local orders</div></div><div class="card stat"><div class="small">APP DEMO SALES</div><b>${money(appSales())}</b><div class="subtitle">Completed test orders</div></div><div class="card stat"><div class="small">MANUAL WEB TOTAL</div><b>${money(webSales())}</b><div class="subtitle">User-entered examples</div></div></div><div class="section">${section("What's next",'Orders sorted by requested pickup time')}${active.length?`<div class="items">${active.slice(0,3).map(ownerOrderCard).join('')}</div>`:'<div class="card note-empty">No active orders. Place a test order from customer view to see it here.</div>'}</div><div class="section">${section('Quick actions')}<div class="row">${btn('+ Add a product','showNewProduct()','button secondary')}${btn('+ Log a web sale','showWebEntry()','button secondary')}</div></div><div class="card section alert">Owner mode is accessible in this prototype without authentication. A real deployment would require a private, secure staff login and backend.</div>`}
const NEXT={Placed:['Accepted','Cancelled'],Accepted:['Preparing','Cancelled'],Preparing:['Ready'],Ready:['Completed'],Completed:[],Cancelled:[]};
function ownerOrderCard(o){return `<div class="card"><div class="row between"><div><h3>#${o.id.slice(0,6).toUpperCase()} · ${esc(o.name)}</h3><div class="small">Requested ${esc(new Date(o.pickup).toLocaleString())}</div></div><span class="badge">${o.status}</span></div><div class="line"></div>${o.lines.map(l=>`<p style="margin:6px 0"><b>${l.qty}× ${esc(l.title)}</b><span class="small"> ${esc(l.note)}</span></p>`).join('')}${o.note?`<p class="small">Other instructions: ${esc(o.note)}</p>`:''}<div class="row between" style="margin-top:16px"><b>${money(sum(o.lines))}</b><div class="row">${(NEXT[o.status]||[]).map(status=>btn(status==='Completed'?'Picked up':status==='Ready'?'Mark ready':status==='Preparing'?'Start prep':status,`advance('${o.id}','${status}')`,status==='Cancelled'?'button secondary compact':'button compact')).join('')}</div></div></div>`}
function ownerOrders(){return `${section('Pickup queue','Move orders from Placed to Ready when prepared')}${db.orders.length?'<div class="items">'+[...db.orders].sort((a,b)=>new Date(a.pickup)-new Date(b.pickup)).map(ownerOrderCard).join('')+'</div>':'<div class="card note-empty">No orders yet.</div>'}`}
function advance(id,status){const o=db.orders.find(a=>a.id===id);if(!o||!(NEXT[o.status]||[]).includes(status))return;const previous=o.status;o.status=status;if(status==='Completed'&&!o.stars)o.stars=Math.floor(sum(o.lines));notice(status==='Ready'?'Your order is ready!':`Order ${status.toLowerCase()}`,`Order #${id.slice(0,6).toUpperCase()} is ${status.toLowerCase()}.`);if(status==='Completed')notice('Stars earned',`This completed order earned ${o.stars} stars.`);persist();render();flash('Order updated: '+status)}
function ownerProducts(){return `${section('Catalog editor','Simple product entry and availability controls')}<div class="row" style="margin-bottom:15px">${btn('+ New item','showNewProduct()')}</div><div class="items">${db.products.map(x=>`<div class="card row"><div class="iconbox">${x.symbol}</div><div class="grow"><b>${esc(x.title)}</b><div class="small">${money(x.price)} · ${esc(x.cat)}</div></div><div style="text-align:right"><button class="button secondary compact" onclick="editProduct('${esc(x.id)}')">Edit</button><label class="small" style="margin-top:9px"><input type="checkbox" ${x.available?'checked':''} onchange="toggleProduct('${esc(x.id)}',this.checked)"> Available</label></div></div>`).join('')}</div>`}
function toggleProduct(id,available){const item=p(id);if(item)item.available=available;persist();render()}
function showNewProduct(){popup(`<div class="modal-head"><h2>Add a new item</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveProduct(event)"><label>Name<input name="title" class="field" required maxlength="70"></label><label style="margin-top:13px">Category<select class="field" name="cat"><option>Flowers</option><option>Coffee</option><option>Plants & Gifts</option></select></label><label style="margin-top:13px">Starting price<input class="field" name="price" type="number" min="0" step="0.01" required></label><label style="margin-top:13px">Description<textarea name="detail" class="field"></textarea></label><button class="button full" style="margin-top:20px">Save item</button></form>`)}
function saveProduct(e){e.preventDefault();const x=Object.fromEntries(new FormData(e.target));if(!x.title.trim()||Number(x.price)<0)return;let item={id:uid(),title:x.title.trim(),cat:x.cat,price:Number(x.price),detail:x.detail||'',symbol:x.cat==='Coffee'?'☕':'✿',available:true,featured:false};db.products.push(item);notice('New arrival · '+item.title,'Discover what is new in the Tiger Lillies demo.');persist();closeModal();render();flash('New product added')}
function editProduct(id){const x=p(id);if(!x)return;popup(`<div class="modal-head"><h2>Edit item</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveEditProduct(event,'${esc(id)}')"><label>Name<input name="title" class="field" value="${esc(x.title)}" required></label><label style="margin-top:13px">Price<input name="price" type="number" min="0" step="0.01" class="field" value="${x.price}" required></label><label style="margin-top:13px">Description<textarea name="detail" class="field">${esc(x.detail)}</textarea></label><button class="button full" style="margin-top:20px">Save changes</button></form>`)}
function saveEditProduct(e,id){e.preventDefault();const x=p(id),d=Object.fromEntries(new FormData(e.target));if(!x||!d.title.trim()||Number(d.price)<0)return;x.title=d.title.trim();x.price=Number(d.price);x.detail=d.detail;persist();closeModal();render();flash('Product updated')}
function ownerInsights(){const a=appSales(),w=webSales(),max=Math.max(a,w)||1;return `${section('App vs. website sales','Channel comparison with honest demo-only data')}<div class="card"><div class="row between"><b>App · completed local test orders</b><b>${money(a)}</b></div><div class="salesbar"><span style="width:${a/max*100}%"></span></div><div class="row between"><b>Website · manually entered</b><b>${money(w)}</b></div><div class="salesbar gray"><span style="width:${w/max*100}%"></span></div><div class="alert">These numbers are <b>not connected to the actual store</b>. Real sales comparisons require website checkout integration or authorized sales data.</div></div><div class="section">${section('Website entries','Optional manual examples')}${btn('+ Log a website sale','showWebEntry()')}<div class="items" style="margin-top:14px">${db.website.length?db.website.map(x=>`<div class="card row between"><div><b>${money(x.amount)}</b><div class="small">${day(x.at)} · ${esc(x.note)}</div></div><button class="link small" onclick="removeWeb('${x.id}')">Delete</button></div>`).join(''):'<div class="card note-empty">No website transactions entered yet.</div>'}</div></div><div class="section">${section('Customer reviews','Private feedback from completed test orders')}${db.reviews.length?db.reviews.map(x=>`<div class="card" style="margin-bottom:10px"><b>${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</b><p>${esc(x.text)||'No written comment'}</p></div>`).join(''):'<div class="card note-empty">No ratings have been submitted.</div>'}</div>`}
function showWebEntry(){popup(`<div class="modal-head"><h2>Log a website sale</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveWeb(event)"><div class="alert">Manual test entry, not a real website transaction or synced payment.</div><label style="margin-top:15px">Amount ($)<input type="number" name="amount" min=".01" step=".01" required class="field"></label><label style="margin-top:13px">Note<input name="note" class="field" placeholder="Example sales figure"></label><button class="button full" style="margin-top:20px">Save comparison entry</button></form>`)}
function saveWeb(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!(Number(d.amount)>0))return;db.website.unshift({id:uid(),amount:Number(d.amount),note:d.note,at:Date.now()});persist();closeModal();render();flash('Manual total recorded')}
function removeWeb(id){db.website=db.website.filter(x=>x.id!==id);persist();render()}
function ownerMessages(){return `${section('Customer messages','Local demonstration — replies stay in this browser')}<div class="card"><div style="max-height:400px;overflow:auto">${db.messages.map(m=>`<div class="message ${m.by==='shop'?'shop':''}"><b class="eyebrow">${m.by==='shop'?'Shop':'Customer'}</b><p style="margin:6px 0">${esc(m.text)}</p><small>${stamp(m.at)}</small></div>`).join('')}</div><div class="row"><input class="field grow" id="msg" placeholder="Write a shop response…" onkeydown="if(event.key==='Enter')sendMessage('shop')"><button class="button" onclick="sendMessage('shop')">Reply ↗</button></div></div>`}
render();
</script></body></html>
